# Reverse proxy putting the web app and the API behind one origin.
events {}

http {
    upstream plantatio_api { server api:8000; }
    upstream plantatio_web { server web:80; }

    server {
        listen 80;
        server_name _;

        # Satellite and leaf images are posted through here.
        client_max_body_size 20m;

        location /api/ {
            proxy_pass         http://plantatio_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Model inference can take a while.
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass       http://plantatio_web;
            proxy_set_header Host $host;
        }
    }
}
